[package]
name = "kahf-app"
version = "0.2.0"
edition = "2021"
description = "KAHF: radio messages without the internet"
license = "GPL-3.0-or-later"

# Its own workspace: the normal KAHF build and CI do not need the webview libraries.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kahf-daemon = { path = "../../crates/kahf-daemon" }
kahf-audio = { path = "../../crates/kahf-audio" }
kahf-core = { path = "../../crates/kahf-core" }
kahf-sdr = { path = "../../crates/kahf-sdr" }

[profile.dev.package.kahf-core]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
