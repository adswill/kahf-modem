[package]
name = "kahf-app"
version = "1.1.1"
edition = "2021"
description = "KAHF: radio messages without the internet"
license = "GPL-3.0-or-later"

# Its own workspace: the normal KAHF build and CI do not need the GPU and window libraries.
[workspace]

[package.metadata.alloy]
identifier = "dev.kahf.app"
product-name = "KAHF"

[dependencies]
alloy-ui = { git = "https://github.com/adswill/alloy-ui", rev = "ee795fd2ec35712e08ebcb27b2c8d34d734cb181" }
kahf-app-core = { path = "../crates/kahf-app-core" }
kahf-core = { path = "../crates/kahf-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.dev.package.kahf-core]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
