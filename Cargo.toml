[workspace]
resolver = "2"
members = ["crates/kahf-core", "crates/kahf-sim", "crates/kahf-cli", "crates/kahf-sdr", "crates/kahf-radio", "crates/kahf-audio", "crates/kahf-daemon", "crates/kahf-gui", "crates/kahf-log", "crates/kahf-prop", "crates/kahf-ui"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license-file = "LICENSE"

# The modem's signal processing is heavy: optimise it even in debug builds, so the receive
# thread keeps up in development and tests (the spectrum must stay at 20 frames a second).
[profile.dev.package.kahf-core]
opt-level = 3
