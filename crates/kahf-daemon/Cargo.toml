[package]
name = "kahf-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
kahf-core = { path = "../kahf-core" }
kahf-audio = { path = "../kahf-audio" }
kahf-sdr = { path = "../kahf-sdr" }
kahf-radio = { path = "../kahf-radio" }
kahf-log = { path = "../kahf-log" }
serde_json = "1.0.154"
# The relay's push link to the mesh: a blocking WebSocket, TLS through rustls (owner approved 2026-11-19).
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[dev-dependencies]
kahf-sim = { path = "../kahf-sim" }
