[package]
name = "kahf-node"
version.workspace = true
edition.workspace = true
description = "Headless KAHF station and relay node, for a Raspberry Pi or any always-on computer"

[dependencies]
kahf-core = { path = "../kahf-core" }
kahf-daemon = { path = "../kahf-daemon" }
kahf-audio = { path = "../kahf-audio" }
kahf-rig = { path = "../kahf-rig" }
serde_json = "1"
ctrlc = { version = "3", features = ["termination"] }
