name: ci

on:
  # Every push and pull request runs one quick Linux check.
  # The full platform matrix runs only when started by hand (workflow_dispatch),
  # to save runner minutes on the private repository.
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Run every platform"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quick:
    name: Linux x64 (quick)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libxcb1-dev libhackrf-dev librtlsdr-dev

      - name: Install stable Rust (rustfmt, clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --exclude kahf-sdr -- -D warnings

      - name: Build
        run: cargo build --workspace --exclude kahf-sdr

      - name: Test
        run: cargo test --workspace --exclude kahf-sdr

  full:
    name: Full platform build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_matrix }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: the app needs macOS 14 or later. Both builds target 14.0.
          - name: macOS 14+ arm64
            runner: macos-14
            target: aarch64-apple-darwin
            sdr_args: ""
            deploy_target: "14.0"
          - name: macOS 14+ Intel
            runner: macos-13
            target: x86_64-apple-darwin
            sdr_args: ""
            deploy_target: "14.0"
          # Windows: x64 and ARM64. The SDR crate is left out until its build script supports Windows.
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            sdr_args: "--exclude kahf-sdr"
            deploy_target: ""
          - name: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            sdr_args: "--exclude kahf-sdr"
            deploy_target: ""
          # Linux: x86_64 and ARM64 (Raspberry Pi 64-bit).
          - name: Linux x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            sdr_args: "--exclude kahf-sdr"
            deploy_target: ""
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            sdr_args: "--exclude kahf-sdr"
            deploy_target: ""
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deploy_target }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libxcb1-dev libhackrf-dev librtlsdr-dev

      - name: Install stable Rust (rustfmt, clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install SDR libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install libhackrf librtlsdr

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --target ${{ matrix.target }} ${{ matrix.sdr_args }} -- -D warnings

      - name: Build
        run: cargo build --workspace --target ${{ matrix.target }} ${{ matrix.sdr_args }}

      - name: Test
        run: cargo test --workspace --target ${{ matrix.target }} ${{ matrix.sdr_args }}
