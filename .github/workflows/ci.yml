name: ci

on:
  # Pull requests run one quick Linux check (including the headless kahf-ui
  # smoke test). Windows and macOS build and test on pushes to main and nightly,
  # not on every PR, to keep the runner queue short. Docs and site only changes
  # skip everything. Start the full platform matrix by hand with workflow_dispatch.
  push:
    branches: [main]
    paths-ignore: &ignore
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - "server/**"
      - ".github/workflows/deploy-site.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths-ignore: *ignore
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Run every platform"
        type: boolean
        default: true

# A newer push to the same branch or PR cancels the older run. Main pushes are
# never cancelled, so every merge keeps its own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  quick:
    name: Linux x64 (quick)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libxcb1-dev libhackrf-dev librtlsdr-dev

      - name: Install stable Rust (rustfmt, clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --exclude kahf-sdr -- -D warnings

      - name: Build
        run: cargo build --workspace --exclude kahf-sdr

      - name: Test
        run: cargo test --workspace --exclude kahf-sdr

  # Windows and macOS on main pushes and nightly. Skips clippy and fmt (the quick
  # job covers them) and the SDR crate, to keep it fast.
  desktop:
    name: ${{ matrix.name }} (main)
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            deploy_target: ""
          - name: macOS 14+ arm64
            runner: macos-14
            deploy_target: "14.0"
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deploy_target }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.runner }}

      - name: Build
        run: cargo build --workspace --exclude kahf-sdr

      - name: Test
        run: cargo test --workspace --exclude kahf-sdr

  full:
    name: Full platform build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_matrix }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: the app needs macOS 14 or later. Both builds target 14.0.
          - name: macOS 14+ arm64
            runner: macos-14
            target: aarch64-apple-darwin
            sdr_args: ""
            deploy_target: "14.0"
          - name: macOS 14+ Intel
            runner: macos-13
            target: x86_64-apple-darwin
            sdr_args: ""
            deploy_target: "14.0"
          # Windows: x64 and ARM64. The SDR crate is left out until its build script supports Windows.
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            sdr_args: "--exclude kahf-sdr"
            deploy_target: ""
          - name: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            sdr_args: "--exclude kahf-sdr"
            deploy_target: ""
          # Linux: x86_64 and ARM64 (Raspberry Pi 64-bit).
          - name: Linux x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            sdr_args: "--exclude kahf-sdr"
            deploy_target: ""
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            sdr_args: "--exclude kahf-sdr"
            deploy_target: ""
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deploy_target }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libxcb1-dev libhackrf-dev librtlsdr-dev

      - name: Install stable Rust (rustfmt, clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install SDR libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install libhackrf librtlsdr

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --target ${{ matrix.target }} ${{ matrix.sdr_args }} -- -D warnings

      - name: Build
        run: cargo build --workspace --target ${{ matrix.target }} ${{ matrix.sdr_args }}

      - name: Test
        run: cargo test --workspace --target ${{ matrix.target }} ${{ matrix.sdr_args }}
