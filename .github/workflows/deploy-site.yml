# Deploys the kahf.dev Worker (server/) when it changes on main.
# Needs the repository secret CLOUDFLARE_API_TOKEN (permission: Workers Scripts edit,
# and Workers Routes / Zone read for the kahf.dev custom domain). Add
# CLOUDFLARE_ACCOUNT_ID too if the token can reach more than one account.
# Without the token the job tests the Worker and skips the deploy.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test the Worker
        working-directory: server
        run: npm test
      - name: Deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: server
        run: npx --yes wrangler@4 deploy
      - name: Note when the deploy is skipped
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the Worker was tested but not deployed."
